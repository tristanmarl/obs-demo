apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: obs-demo-gateway
  namespace: obs-demo
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: control-ui
  namespace: obs-demo
spec:
  hosts:
    - "*"
  gateways:
    - obs-demo-gateway
  http:
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: gateway-api.obs-demo.svc.cluster.local
            port:
              number: 8080
    - route:
        - destination:
            host: control-ui.obs-demo.svc.cluster.local
            port:
              number: 8080
---
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: obs-demo-default
  namespace: obs-demo
spec:
  tracing:
    - providers:
        - name: dynatrace-otel
      randomSamplingPercentage: 100
  accessLogging:
    - providers:
        - name: envoy
