apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: traceforge-data
data:
  001-schema.sql: |
    create table if not exists catalog_items (
      id text primary key,
      name text not null,
      value integer not null
    );
    create table if not exists jobs (
      id text primary key,
      name text not null,
      work_units integer not null,
      status text not null,
      created_at timestamptz not null default now(),
      completed_at timestamptz
    );
    insert into catalog_items(id, name, value) values
      ('item-a', 'Item A', 10),
      ('item-b', 'Item B', 20),
      ('item-c', 'Item C', 30)
    on conflict (id) do nothing;
