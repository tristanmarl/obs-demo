apiVersion: v1
kind: Secret
metadata:
  name: data-secrets
  namespace: obs-demo-data
type: Opaque
stringData:
  POSTGRES_USER: obs_demo
  POSTGRES_PASSWORD: obs_demo
  POSTGRES_DB: obs_demo
  ACTIVEMQ_USER: admin
  ACTIVEMQ_PASSWORD: admin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: obs-demo-data
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "${OTEL_RESOURCE_ATTRIBUTES}"
            - name: DT_CUSTOM_PROP
              value: "${DT_CUSTOM_PROP}"
          envFrom:
            - secretRef:
                name: data-secrets
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "obs_demo", "-d", "obs_demo"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "obs_demo", "-d", "obs_demo"]
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: obs-demo-data
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: activemq
  namespace: obs-demo-data
spec:
  serviceName: activemq
  replicas: 1
  selector:
    matchLabels:
      app: activemq
  template:
    metadata:
      labels:
        app: activemq
      annotations:
        oneagent.dynatrace.com/inject: "true"
        metadata.dynatrace.com/service: activemq
    spec:
      containers:
        - name: activemq
          image: apache/activemq-classic:6.1.7
          ports:
            - name: openwire
              containerPort: 61616
            - name: stomp
              containerPort: 61613
            - name: web
              containerPort: 8161
          env:
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "${OTEL_RESOURCE_ATTRIBUTES}"
            - name: DT_CUSTOM_PROP
              value: "${DT_CUSTOM_PROP}"
          readinessProbe:
            tcpSocket: {port: 61613}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 61613}
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: activemq-data
              mountPath: /opt/apache-activemq/data
  volumeClaimTemplates:
    - metadata:
        name: activemq-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: activemq
  namespace: obs-demo-data
spec:
  selector:
    app: activemq
  ports:
    - name: openwire
      port: 61616
      targetPort: 61616
    - name: stomp
      port: 61613
      targetPort: 61613
    - name: web
      port: 8161
      targetPort: 8161
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: obs-demo-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          env:
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "${OTEL_RESOURCE_ATTRIBUTES}"
            - name: DT_CUSTOM_PROP
              value: "${DT_CUSTOM_PROP}"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: obs-demo-data
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
