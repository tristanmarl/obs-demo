# NebulaTrace application demo.
# Prerequisites:
# - Dynatrace Operator and a healthy DynaKube already installed.
# - Istio already installed. The nebulatrace namespace enables sidecar injection.
# - Public container images under your configured IMAGE_REGISTRY.
# - A default StorageClass for PostgreSQL and ActiveMQ PVCs.
apiVersion: v1
kind: Namespace
metadata:
  name: dynatrace
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: nebulatrace
  labels:
    istio-injection: enabled
    nebulatrace.dev/otel: "true"
    nebulatrace.dev/oneagent: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: nebulatrace-data
  labels:
    istio-injection: disabled
    nebulatrace.dev/oneagent: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: nebulatrace-data
data:
  001-schema.sql: |
    create table if not exists artifacts (
      sku text primary key,
      name text not null,
      stock integer not null
    );
    create table if not exists releases (
      id text primary key,
      service text not null,
      version text not null,
      environment text not null,
      status text not null,
      created_at timestamptz not null default now()
    );
    insert into artifacts(sku, name, stock) values
      ('checkout-service', 'Checkout service artifact', 12),
      ('payments-service', 'Payments service artifact', 8),
      ('customer-portal', 'Customer portal artifact', 24)
    on conflict (sku) do nothing;
---
apiVersion: v1
kind: Secret
metadata:
  name: data-secrets
  namespace: nebulatrace-data
type: Opaque
stringData:
  POSTGRES_USER: nebulatrace
  POSTGRES_PASSWORD: nebulatrace
  POSTGRES_DB: nebulatrace
  ACTIVEMQ_USER: admin
  ACTIVEMQ_PASSWORD: admin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: nebulatrace-data
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=demo,service.namespace=nebulatrace,team=service-monitoring"
            - name: DT_CUSTOM_PROP
              value: "dt.owner=service-monitoring"
          envFrom:
            - secretRef:
                name: data-secrets
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nebulatrace-data
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: activemq
  namespace: nebulatrace-data
spec:
  serviceName: activemq
  replicas: 1
  selector:
    matchLabels:
      app: activemq
  template:
    metadata:
      labels:
        app: activemq
      annotations:
        oneagent.dynatrace.com/inject: "true"
        metadata.dynatrace.com/service: activemq
    spec:
      containers:
        - name: activemq
          image: apache/activemq-classic:6.1.7
          ports:
            - name: openwire
              containerPort: 61616
            - name: stomp
              containerPort: 61613
            - name: web
              containerPort: 8161
          env:
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=demo,service.namespace=nebulatrace,team=service-monitoring"
            - name: DT_CUSTOM_PROP
              value: "dt.owner=service-monitoring"
          volumeMounts:
            - name: activemq-data
              mountPath: /opt/apache-activemq/data
  volumeClaimTemplates:
    - metadata:
        name: activemq-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: activemq
  namespace: nebulatrace-data
spec:
  selector:
    app: activemq
  ports:
    - name: openwire
      port: 61616
      targetPort: 61616
    - name: stomp
      port: 61613
      targetPort: 61613
    - name: web
      port: 8161
      targetPort: 8161
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: nebulatrace-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          env:
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=demo,service.namespace=nebulatrace,team=service-monitoring"
            - name: DT_CUSTOM_PROP
              value: "dt.owner=service-monitoring"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: nebulatrace-data
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nebulatrace-config
  namespace: nebulatrace
data:
  DATABASE_URL: postgresql://nebulatrace:nebulatrace@postgres.nebulatrace-data:5432/nebulatrace
  ACTIVEMQ_HOST: activemq.nebulatrace-data
  ACTIVEMQ_STOMP_PORT: "61613"
  ACTIVEMQ_USER: admin
  ACTIVEMQ_PASSWORD: admin
  DEPLOYMENT_QUEUE: /queue/deployments.requested
  REDIS_URL: redis://redis.nebulatrace-data:6379
  ARTIFACT_URL: http://artifact-api:8080
  QUOTA_URL: http://quota-api:8080
  RELEASE_URL: http://release-api:8080
  INCIDENT_ASSISTANT_URL: http://incident-assistant:8080
  LLM_URL: http://mock-llm:8080
  AUDIT_URL: http://audit-api:8080
  RUNNER_ADDRESS: runner-agent:50051
  PLATFORM_URL: http://platform-api:8080
  SERVICE_VERSION: "latest"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=demo,service.namespace=nebulatrace,team=service-monitoring"
  DT_CUSTOM_PROP: "dt.owner=service-monitoring"
  DEMO_CONTROLS_ENABLED: "true"
  LOADGEN_DELAY_MS: "750"
  LOADGEN_BURST: "1"
  LOADGEN_ERROR_RATE: "0.02"
  WEBHOOK_DELAY_MS: "5000"
  FAAS_PROVIDER: "aws"
  FAAS_VERSION: "1.0.0"
  MEMORY_PRESSURE_MB: "4"
  MEMORY_SURVIVOR_BATCHES: "8"
  QUOTA_LIMIT: "10"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api
  namespace: nebulatrace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-api-controls
  namespace: nebulatrace
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - engineering-portal
      - platform-api
      - artifact-api
      - release-api
      - quota-api
      - deployment-worker
      - audit-api
      - incident-assistant
      - mock-llm
      - webhook-function
      - runner-agent
      - load-generator
    verbs: ["get", "patch"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    resourceNames: ["quota-api"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-api-controls
  namespace: nebulatrace
subjects:
  - kind: ServiceAccount
    name: platform-api
    namespace: nebulatrace
roleRef:
  kind: Role
  name: platform-api-controls
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-api-data-controls
  namespace: nebulatrace-data
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["redis"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["postgres", "activemq"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-api-data-controls
  namespace: nebulatrace-data
subjects:
  - kind: ServiceAccount
    name: platform-api
    namespace: nebulatrace
roleRef:
  kind: Role
  name: platform-api-data-controls
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engineering-portal
  namespace: nebulatrace
spec:
  replicas: 1
  selector:
    matchLabels: {app: engineering-portal}
  template:
    metadata:
      labels: {app: engineering-portal}
      annotations:
        oneagent.dynatrace.com/inject: "true"
        metadata.dynatrace.com/service: engineering-portal
    spec:
      containers:
        - name: engineering-portal
          image: ghcr.io/tristanmarl/nebulatrace/engineering-portal:latest
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: nebulatrace-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: engineering-portal
  namespace: nebulatrace
spec:
  selector: {app: engineering-portal}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: nebulatrace
spec:
  replicas: 1
  selector:
    matchLabels: {app: platform-api}
  template:
    metadata:
      labels: {app: platform-api}
      annotations:
        oneagent.dynatrace.com/inject: "true"
        metadata.dynatrace.com/service: platform-api
    spec:
      serviceAccountName: platform-api
      containers:
        - name: platform-api
          image: ghcr.io/tristanmarl/nebulatrace/platform-api:latest
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: nebulatrace-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: nebulatrace
spec:
  selector: {app: platform-api}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-api
  namespace: nebulatrace
spec:
  replicas: 1
  selector:
    matchLabels: {app: artifact-api}
  template:
    metadata:
      labels: {app: artifact-api}
      annotations:
        oneagent.dynatrace.com/inject: "true"
        metadata.dynatrace.com/service: artifact-api
    spec:
      containers:
        - name: artifact-api
          image: ghcr.io/tristanmarl/nebulatrace/artifact-api:latest
          ports: [{containerPort: 8080}]
          env:
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres.nebulatrace-data:5432/nebulatrace"}
            - {name: SPRING_DATASOURCE_USERNAME, value: nebulatrace}
            - {name: SPRING_DATASOURCE_PASSWORD, value: nebulatrace}
            - {name: SCENARIO_MODE, value: stable}
          envFrom: [{configMapRef: {name: nebulatrace-config}}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: artifact-api
  namespace: nebulatrace
spec:
  selector: {app: artifact-api}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-api
  namespace: nebulatrace
spec:
  replicas: 1
  selector:
    matchLabels: {app: release-api}
  template:
    metadata:
      labels: {app: release-api}
      annotations:
        otlp-exporter-configuration.dynatrace.com/inject: "true"
        metadata.dynatrace.com/service: release-api
    spec:
      containers:
        - name: release-api
          image: ghcr.io/tristanmarl/nebulatrace/release-api:latest
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: nebulatrace-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: release-api
  namespace: nebulatrace
spec:
  selector: {app: release-api}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-api
  namespace: nebulatrace
spec:
  replicas: 1
  selector:
    matchLabels: {app: quota-api, version: stable}
  template:
    metadata:
      labels: {app: quota-api, version: stable}
      annotations:
        oneagent.dynatrace.com/inject: "true"
        metadata.dynatrace.com/service: quota-api
    spec:
      containers:
        - name: quota-api
          image: ghcr.io/tristanmarl/nebulatrace/quota-api:latest
          ports: [{containerPort: 8080}]
          env:
            - {name: SCENARIO_MODE, value: stable}
          envFrom: [{configMapRef: {name: nebulatrace-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: quota-api
  namespace: nebulatrace
spec:
  selector: {app: quota-api, version: stable}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-worker
  namespace: nebulatrace
spec:
  replicas: 1
  selector:
    matchLabels: {app: deployment-worker}
  template:
    metadata:
      labels: {app: deployment-worker}
      annotations:
        otlp-exporter-configuration.dynatrace.com/inject: "true"
        metadata.dynatrace.com/service: deployment-worker
    spec:
      containers:
        - name: deployment-worker
          image: ghcr.io/tristanmarl/nebulatrace/deployment-worker:latest
          env:
            - {name: SCENARIO_MODE, value: stable}
          envFrom: [{configMapRef: {name: nebulatrace-config}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-api
  namespace: nebulatrace
spec:
  replicas: 1
  selector:
    matchLabels: {app: audit-api}
  template:
    metadata:
      labels: {app: audit-api}
      annotations:
        oneagent.dynatrace.com/inject: "true"
        metadata.dynatrace.com/service: audit-api
    spec:
      containers:
        - name: audit-api
          image: ghcr.io/tristanmarl/nebulatrace/audit-api:latest
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: nebulatrace-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: audit-api
  namespace: nebulatrace
spec:
  selector: {app: audit-api}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-assistant
  namespace: nebulatrace
spec:
  replicas: 1
  selector:
    matchLabels: {app: incident-assistant}
  template:
    metadata:
      labels: {app: incident-assistant}
      annotations:
        otlp-exporter-configuration.dynatrace.com/inject: "true"
        metadata.dynatrace.com/service: incident-assistant
    spec:
      containers:
        - name: incident-assistant
          image: ghcr.io/tristanmarl/nebulatrace/incident-assistant:latest
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: nebulatrace-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: incident-assistant
  namespace: nebulatrace
spec:
  selector: {app: incident-assistant}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-llm
  namespace: nebulatrace
spec:
  replicas: 1
  selector:
    matchLabels: {app: mock-llm}
  template:
    metadata:
      labels: {app: mock-llm}
      annotations:
        otlp-exporter-configuration.dynatrace.com/inject: "true"
        metadata.dynatrace.com/service: mock-llm
    spec:
      containers:
        - name: mock-llm
          image: ghcr.io/tristanmarl/nebulatrace/mock-llm:latest
          ports: [{containerPort: 8080}]
          env:
            - {name: SCENARIO_MODE, value: stable}
          envFrom: [{configMapRef: {name: nebulatrace-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: mock-llm
  namespace: nebulatrace
spec:
  selector: {app: mock-llm}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-function
  namespace: nebulatrace
spec:
  replicas: 1
  selector:
    matchLabels: {app: webhook-function}
  template:
    metadata:
      labels: {app: webhook-function}
      annotations:
        otlp-exporter-configuration.dynatrace.com/inject: "true"
        metadata.dynatrace.com/service: webhook-function
    spec:
      containers:
        - name: webhook-function
          image: ghcr.io/tristanmarl/nebulatrace/webhook-function:latest
          envFrom: [{configMapRef: {name: nebulatrace-config}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runner-agent
  namespace: nebulatrace
spec:
  replicas: 1
  selector:
    matchLabels: {app: runner-agent}
  template:
    metadata:
      labels: {app: runner-agent}
      annotations:
        otlp-exporter-configuration.dynatrace.com/inject: "true"
        metadata.dynatrace.com/service: runner-agent
    spec:
      containers:
        - name: runner-agent
          image: ghcr.io/tristanmarl/nebulatrace/runner-agent:latest
          ports: [{containerPort: 50051}]
          env:
            - {name: SCENARIO_MODE, value: stable}
          envFrom: [{configMapRef: {name: nebulatrace-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: runner-agent
  namespace: nebulatrace
spec:
  selector: {app: runner-agent}
  ports: [{name: grpc, port: 50051, targetPort: 50051}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: nebulatrace
spec:
  replicas: 1
  selector:
    matchLabels: {app: load-generator}
  template:
    metadata:
      labels: {app: load-generator}
      annotations:
        oneagent.dynatrace.com/inject: "true"
        metadata.dynatrace.com/service: load-generator
    spec:
      containers:
        - name: load-generator
          image: ghcr.io/tristanmarl/nebulatrace/load-generator:latest
          envFrom: [{configMapRef: {name: nebulatrace-config}}]
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: nebulatrace-gateway
  namespace: nebulatrace
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: engineering-portal
  namespace: nebulatrace
spec:
  hosts:
    - "*"
  gateways:
    - nebulatrace-gateway
  http:
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: platform-api.nebulatrace.svc.cluster.local
            port:
              number: 8080
    - route:
        - destination:
            host: engineering-portal.nebulatrace.svc.cluster.local
            port:
              number: 8080
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: quota-api
  namespace: nebulatrace
spec:
  host: quota-api.nebulatrace.svc.cluster.local
  subsets:
    - name: stable
      labels:
        version: stable
    - name: unstable
      labels:
        version: unstable
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: quota-api
  namespace: nebulatrace
spec:
  hosts:
    - quota-api.nebulatrace.svc.cluster.local
  http:
    - route:
        - destination:
            host: quota-api.nebulatrace.svc.cluster.local
            subset: stable
            port:
              number: 8080
---
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: nebulatrace-default
  namespace: nebulatrace
spec:
  tracing:
    - providers:
        - name: dynatrace-otel
      randomSamplingPercentage: 100
  accessLogging:
    - providers:
        - name: envoy
