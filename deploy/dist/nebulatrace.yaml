            - {name: SERVICE_NAME, value: aws-lambda-trigger}
            - {name: FAAS_FUNCTION_NAME, value: aws-lambda-trigger}
            - {name: FAAS_PROVIDER, value: aws}
            - {name: TRIGGER_DELAY_MS, value: "6500"}
            - {name: CLOUD_REGION, value: us-east-1}
