# NebulaTrace application demo.
# Prerequisites:
# - Dynatrace Operator and a healthy DynaKube already installed.
# - Istio already installed. The nebulatrace namespace enables sidecar injection.
# - Public container images under your configured IMAGE_REGISTRY.
# - A default StorageClass for PostgreSQL and ActiveMQ PVCs.
apiVersion: v1
kind: Namespace
metadata:
  name: dynatrace
---
apiVersion: v1
kind: Namespace
metadata:
  name: istio-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: nebulatrace
  labels:
    istio-injection: enabled
    nebulatrace.dev/otel: "true"
    nebulatrace.dev/oneagent: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: nebulatrace-data
  labels:
    istio-injection: disabled
    nebulatrace.dev/oneagent: "true"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: nebulatrace-data
data:
  001-schema.sql: |
    create table if not exists catalog_items (
      id text primary key,
      name text not null,
      value integer not null
    );
    create table if not exists jobs (
      id text primary key,
      name text not null,
      work_units integer not null,
      status text not null,
      created_at timestamptz not null default now(),
      completed_at timestamptz
    );
    insert into catalog_items(id, name, value) values
      ('item-a', 'Item A', 10),
      ('item-b', 'Item B', 20),
      ('item-c', 'Item C', 30)
    on conflict (id) do nothing;
---
apiVersion: v1
kind: Secret
metadata:
  name: data-secrets
  namespace: nebulatrace-data
type: Opaque
stringData:
  POSTGRES_USER: nebulatrace
  POSTGRES_PASSWORD: nebulatrace
  POSTGRES_DB: nebulatrace
  ACTIVEMQ_USER: admin
  ACTIVEMQ_PASSWORD: admin
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: nebulatrace-data
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=demo,service.namespace=nebulatrace,team=service-monitoring"
            - name: DT_CUSTOM_PROP
              value: "dt.owner=service-monitoring"
          envFrom:
            - secretRef:
                name: data-secrets
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: nebulatrace-data
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: activemq
  namespace: nebulatrace-data
spec:
  serviceName: activemq
  replicas: 1
  selector:
    matchLabels:
      app: activemq
  template:
    metadata:
      labels:
        app: activemq
      annotations:
        oneagent.dynatrace.com/inject: "true"
        metadata.dynatrace.com/service: activemq
    spec:
      containers:
        - name: activemq
          image: apache/activemq-classic:6.1.7
          ports:
            - name: openwire
              containerPort: 61616
            - name: stomp
              containerPort: 61613
            - name: web
              containerPort: 8161
          env:
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=demo,service.namespace=nebulatrace,team=service-monitoring"
            - name: DT_CUSTOM_PROP
              value: "dt.owner=service-monitoring"
          volumeMounts:
            - name: activemq-data
              mountPath: /opt/apache-activemq/data
  volumeClaimTemplates:
    - metadata:
        name: activemq-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: activemq
  namespace: nebulatrace-data
spec:
  selector:
    app: activemq
  ports:
    - name: openwire
      port: 61616
      targetPort: 61616
    - name: stomp
      port: 61613
      targetPort: 61613
    - name: web
      port: 8161
      targetPort: 8161
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: nebulatrace-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          env:
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=demo,service.namespace=nebulatrace,team=service-monitoring"
            - name: DT_CUSTOM_PROP
              value: "dt.owner=service-monitoring"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: nebulatrace-data
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nebulatrace-config
  namespace: nebulatrace
data:
  DATABASE_URL: postgresql://nebulatrace:nebulatrace@postgres.nebulatrace-data:5432/nebulatrace
  ACTIVEMQ_HOST: activemq.nebulatrace-data
  ACTIVEMQ_STOMP_PORT: "61613"
  ACTIVEMQ_USER: admin
  ACTIVEMQ_PASSWORD: admin
  JOB_QUEUE: /queue/jobs.requested
  REDIS_URL: redis://redis.nebulatrace-data:6379
  CATALOG_URL: http://catalog-api:8080
  CACHE_URL: http://cache-api:8080
  JOB_URL: http://job-api:8080
  ANALYSIS_URL: http://analysis-api:8080
  LLM_URL: http://mock-llm:8080
  RESULT_URL: http://result-api:8080
  GRPC_ADDRESS: grpc-service:50051
  GATEWAY_URL: http://gateway-api:8080
  SERVICE_VERSION: "latest"
  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=demo,service.namespace=nebulatrace,team=service-monitoring"
  DT_CUSTOM_PROP: "dt.owner=service-monitoring"
  DEMO_CONTROLS_ENABLED: "true"
  LOADGEN_DELAY_MS: "750"
  LOADGEN_BURST: "1"
  LOADGEN_ERROR_RATE: "0.05"
  FAAS_VERSION: "1.0.0"
  MEMORY_PRESSURE_MB: "4"
  MEMORY_SURVIVOR_BATCHES: "8"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-api
  namespace: nebulatrace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-api-controls
  namespace: nebulatrace
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - control-ui
      - gateway-api
      - catalog-api
      - job-api
      - cache-api
      - job-worker
      - result-api
      - analysis-api
      - mock-llm
      - aws-lambda-trigger
      - azure-functions-trigger
      - google-cloud-function-trigger
      - grpc-service
      - load-generator
      - cache-exporter
      - queue-exporter
    verbs: ["get", "patch"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices"]
    resourceNames: ["cache-api"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-api-controls
  namespace: nebulatrace
subjects:
  - kind: ServiceAccount
    name: gateway-api
    namespace: nebulatrace
roleRef:
  kind: Role
  name: gateway-api-controls
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-api-data-controls
  namespace: nebulatrace-data
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["redis"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["postgres", "activemq"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-api-data-controls
  namespace: nebulatrace-data
subjects:
  - kind: ServiceAccount
    name: gateway-api
    namespace: nebulatrace
roleRef:
  kind: Role
  name: gateway-api-data-controls
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-ui
  namespace: nebulatrace
spec:
  replicas: 1
  selector: {matchLabels: {app: control-ui}}
  template:
    metadata:
      labels: {app: control-ui}
      annotations:
        oneagent.dynatrace.com/inject: "true"
        metadata.dynatrace.com/service: control-ui
    spec:
      containers:
        - name: control-ui
          image: ghcr.io/tristanmarl/nebulatrace/control-ui:latest
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: nebulatrace-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: control-ui
  namespace: nebulatrace
spec:
  selector: {app: control-ui}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-api
  namespace: nebulatrace
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway-api}}
  template:
    metadata:
      labels: {app: gateway-api}
      annotations:
        oneagent.dynatrace.com/inject: "true"
        metadata.dynatrace.com/service: gateway-api
    spec:
      serviceAccountName: gateway-api
      containers:
        - name: gateway-api
          image: ghcr.io/tristanmarl/nebulatrace/gateway-api:latest
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: nebulatrace-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-api
  namespace: nebulatrace
spec:
  selector: {app: gateway-api}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: nebulatrace
spec:
  replicas: 1
  selector: {matchLabels: {app: catalog-api}}
  template:
    metadata:
      labels: {app: catalog-api}
      annotations:
        oneagent.dynatrace.com/inject: "true"
        metadata.dynatrace.com/service: catalog-api
    spec:
      containers:
        - name: catalog-api
          image: ghcr.io/tristanmarl/nebulatrace/catalog-api:latest
          ports: [{containerPort: 8080}]
          env:
            - {name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres.nebulatrace-data:5432/nebulatrace"}
            - {name: SPRING_DATASOURCE_USERNAME, value: nebulatrace}
            - {name: SPRING_DATASOURCE_PASSWORD, value: nebulatrace}
            - {name: SCENARIO_MODE, value: stable}
          envFrom: [{configMapRef: {name: nebulatrace-config}}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: nebulatrace
spec:
  selector: {app: catalog-api}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
