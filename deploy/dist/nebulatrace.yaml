apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache-exporter
  namespace: nebulatrace
spec:
  replicas: 1
  selector: {matchLabels: {app: cache-exporter}}
  template:
    metadata:
      labels: {app: cache-exporter}
      annotations:
        oneagent.dynatrace.com/inject: "true"
        metadata.dynatrace.com/service: cache-exporter
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
        metrics.dynatrace.com/scrape: "true"
        metrics.dynatrace.com/port: "15020"
        metrics.dynatrace.com/path: /stats/prometheus
        metrics.dynatrace.com/filter: '{"mode": "include", "names": ["nebulatrace_*"]}'
    spec:
      containers:
        - name: cache-exporter
          image: ghcr.io/tristanmarl/nebulatrace/cache-exporter:latest
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: nebulatrace-config}}]
---
apiVersion: v1
kind: Service
metadata:
  name: cache-exporter
  namespace: nebulatrace
spec:
