        metrics.dynatrace.com/port: "15020"
        metrics.dynatrace.com/path: /stats/prometheus
        metrics.dynatrace.com/filter: '{"mode": "include", "names": ["nebulatrace_*"]}'
    spec:
      containers:
        - name: queue-exporter
          image: ghcr.io/tristanmarl/nebulatrace/queue-exporter:latest
          ports: [{containerPort: 8080}]
          envFrom: [{configMapRef: {name: nebulatrace-config}}]
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: nebulatrace-gateway
  namespace: nebulatrace
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: control-ui
  namespace: nebulatrace
spec:
  hosts:
    - "*"
  gateways:
    - nebulatrace-gateway
  http:
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: gateway-api.nebulatrace.svc.cluster.local
            port:
              number: 8080
    - route:
        - destination:
            host: control-ui.nebulatrace.svc.cluster.local
            port:
              number: 8080
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: cache-api
  namespace: nebulatrace
spec:
  host: cache-api.nebulatrace.svc.cluster.local
  subsets:
    - name: stable
      labels:
        version: stable
    - name: unstable
      labels:
        version: unstable
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: cache-api
  namespace: nebulatrace
spec:
  hosts:
    - cache-api.nebulatrace.svc.cluster.local
  http:
    - route:
        - destination:
            host: cache-api.nebulatrace.svc.cluster.local
            subset: stable
            port:
              number: 8080
---
apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: nebulatrace-default
  namespace: nebulatrace
spec:
  tracing:
    - providers:
        - name: dynatrace-otel
      randomSamplingPercentage: 100
  accessLogging:
    - providers:
        - name: envoy
