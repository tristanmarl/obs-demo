name: Publish images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/tristanmarl/obs-demo

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make verify

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # Services with their own build context (apps/<service>)
          - service: control-ui
            shared_ctx: false
          - service: gateway-api
            shared_ctx: false
          - service: catalog-api
            shared_ctx: false
          - service: cache-api
            shared_ctx: false
          - service: result-api
            shared_ctx: false
          - service: load-generator
            shared_ctx: false
          - service: cache-exporter
            shared_ctx: false
          # Services that need the shared apps/ context (Dockerfile at apps/<service>/Dockerfile, context at apps/)
          - service: job-worker
            shared_ctx: true
          - service: function-trigger
            shared_ctx: true
          - service: analysis-api
            shared_ctx: true
          - service: job-api
            shared_ctx: true
          - service: mock-llm
            shared_ctx: true
          - service: grpc-service
            shared_ctx: true
          - service: queue-exporter
            shared_ctx: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.shared_ctx && 'apps' || format('apps/{0}', matrix.service) }}
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  render-manifest:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Render dist manifest
        run: ./scripts/render-install-yaml.sh --no-env

      - name: Commit updated manifest
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "chore: update dist manifest [skip ci]"
          file_pattern: deploy/dist/obs-demo.yaml
